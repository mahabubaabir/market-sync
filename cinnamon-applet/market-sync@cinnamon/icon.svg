<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Market Sync — frosted-glass tile icon (v1.5.2).
       A translucent glass squircle carries the bold twin folded arrows, with
       a top sheen and hairline light edge so it reads as glass on any panel. -->
  <defs>
    <linearGradient id="glassBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="arrowA" gradientUnits="userSpaceOnUse" x1="26" y1="78" x2="58" y2="26">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="arrowB" gradientUnits="userSpaceOnUse" x1="74" y1="22" x2="42" y2="74">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <!-- soft shadow -->
  <rect x="7" y="8" width="86" height="86" rx="24" fill="#000000" fill-opacity="0.35" filter="url(#tileShadow)"/>

  <!-- glass tile -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="#141c2b" fill-opacity="0.62"/>
  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#glassBody)"
        stroke="#ffffff" stroke-opacity="0.32" stroke-width="1.5"/>

  <!-- top sheen -->
  <path d="M 14 30 Q 14 12 32 12 L 68 12 Q 86 12 86 30 Q 86 22 70 22 L 30 22 Q 14 22 14 30 Z"
        fill="#ffffff" fill-opacity="0.14"/>

  <!-- bold twin folded arrows -->
  <path d="M 32.75 16.14 A 38 38 0 0 0 25.07 78.68 L 37.64 82.21 L 41.22 72.87 L 36.22 65.85 A 21 21 0 0 1 44.56 29.72 Z"
        fill="url(#arrowA)" stroke="#0b1220" stroke-opacity="0.22" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M 67.25 83.86 A 38 38 0 0 0 74.93 21.32 L 62.36 17.79 L 58.78 27.13 L 63.78 34.15 A 21 21 0 0 1 55.44 70.28 Z"
        fill="url(#arrowB)" stroke="#0b1220" stroke-opacity="0.22" stroke-width="2.2" stroke-linejoin="round"/>
</svg>
