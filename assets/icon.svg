<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Market Sync — two bold folded arrows chasing each other round the ring.
       Tuned for 16px: 28-unit thick bands, blunt heads (sharp tips alias away
       at tray size), 42-degree gaps so both arrows stay readable as separate
       shapes, and a soft dark keyline that keeps it visible on light panels. -->
  <defs>
    <linearGradient id="arrowA" gradientUnits="userSpaceOnUse" x1="18" y1="82" x2="62" y2="18">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="arrowB" gradientUnits="userSpaceOnUse" x1="82" y1="18" x2="38" y2="82">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Upper arrow: cyan -> indigo -->
  <path d="M 28.66 8.12 A 47 47 0 0 0 19.17 85.47 L 36.02 86.41 L 40.32 75.21 L 37.53 64.34 A 19 19 0 0 1 45.08 31.65 Z"
        fill="url(#arrowA)" stroke="#0b1220" stroke-opacity="0.22" stroke-width="3" stroke-linejoin="round"/>

  <!-- Lower arrow (180 degrees opposite): emerald -> sky -->
  <path d="M 71.34 91.88 A 47 47 0 0 0 80.83 14.53 L 63.98 13.59 L 59.68 24.79 L 62.47 35.66 A 19 19 0 0 1 54.92 68.35 Z"
        fill="url(#arrowB)" stroke="#0b1220" stroke-opacity="0.22" stroke-width="3" stroke-linejoin="round"/>
</svg>
