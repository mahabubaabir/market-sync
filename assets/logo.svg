<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="syncGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="syncGrad2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Market Sync — Bold Minimal Geometric Logo -->
  <!-- Upper Synchronizing Arc -->
  <path d="M 50,14 A 36,36 0 0,1 86,50 A 36,36 0 0,1 77.5,73.5 L 68,64 A 24,24 0 0,0 74,50 A 24,24 0 0,0 50,26 L 50,36 L 32,20 L 50,4 Z" fill="url(#syncGrad1)"/>

  <!-- Lower Synchronizing Arc -->
  <path d="M 50,86 A 36,36 0 0,1 14,50 A 36,36 0 0,1 22.5,26.5 L 32,36 A 24,24 0 0,0 26,50 A 24,24 0 0,0 50,74 L 50,64 L 68,80 L 50,96 Z" fill="url(#syncGrad2)"/>

  <!-- Central Convergence Core -->
  <circle cx="50" cy="50" r="7" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="4" fill="#38bdf8"/>
</svg>
