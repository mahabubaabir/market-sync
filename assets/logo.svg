<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Market Sync brand mark — twin synchronizing arrows converging on an
       illuminated core. Same bold geometry as assets/icon.svg (28-unit bands,
       blunt heads, 42-degree gaps) with the sync-point glow added back for
       large-size/brand usage (docs, README, release notes). -->
  <defs>
    <linearGradient id="arrowA" gradientUnits="userSpaceOnUse" x1="18" y1="82" x2="62" y2="18">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="arrowB" gradientUnits="userSpaceOnUse" x1="82" y1="18" x2="38" y2="82">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="coreGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Upper arrow: cyan -> indigo -->
  <path d="M 28.66 8.12 A 47 47 0 0 0 19.17 85.47 L 36.02 86.41 L 40.32 75.21 L 37.53 64.34 A 19 19 0 0 1 45.08 31.65 Z"
        fill="url(#arrowA)"/>

  <!-- Lower arrow (180 degrees opposite): emerald -> sky -->
  <path d="M 71.34 91.88 A 47 47 0 0 0 80.83 14.53 L 63.98 13.59 L 59.68 24.79 L 62.47 35.66 A 19 19 0 0 1 54.92 68.35 Z"
        fill="url(#arrowB)"/>

  <!-- Illuminated convergence core -->
  <circle cx="50" cy="50" r="6.5" fill="#ffffff" opacity="0.9" filter="url(#coreGlow)"/>
  <circle cx="50" cy="50" r="6.5" fill="#ffffff"/>
  <circle cx="50" cy="50" r="3.5" fill="#38bdf8"/>
</svg>
