<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- London Eye / Ferris Wheel Landmark -->
  <!-- Outer Wheel Rim -->
  <circle cx="32" cy="28" r="22" fill="none" stroke="#8ecd76" stroke-width="2"/>
  <circle cx="32" cy="28" r="17" fill="none" stroke="#8ecd76" stroke-width="1.2" opacity="0.6"/>
  <!-- Central Hub -->
  <circle cx="32" cy="28" r="3.5" fill="#8ecd76"/>
  <!-- Spokes -->
  <line x1="32" y1="6" x2="32" y2="50" stroke="#8ecd76" stroke-width="1"/>
  <line x1="10" y1="28" x2="54" y2="28" stroke="#8ecd76" stroke-width="1"/>
  <line x1="16.4" y1="12.4" x2="47.6" y2="43.6" stroke="#8ecd76" stroke-width="1"/>
  <line x1="16.4" y1="43.6" x2="47.6" y2="12.4" stroke="#8ecd76" stroke-width="1"/>
  <!-- Passenger Pods -->
  <circle cx="32" cy="6" r="2" fill="#8ecd76"/>
  <circle cx="54" cy="28" r="2" fill="#8ecd76"/>
  <circle cx="32" cy="50" r="2" fill="#8ecd76"/>
  <circle cx="10" cy="28" r="2" fill="#8ecd76"/>
  <circle cx="47.6" cy="12.4" r="2" fill="#8ecd76"/>
  <circle cx="47.6" cy="43.6" r="2" fill="#8ecd76"/>
  <circle cx="16.4" cy="43.6" r="2" fill="#8ecd76"/>
  <circle cx="16.4" cy="12.4" r="2" fill="#8ecd76"/>
  <!-- A-Frame Stand -->
  <line x1="32" y1="28" x2="20" y2="58" stroke="#8ecd76" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="28" x2="44" y2="58" stroke="#8ecd76" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="16" y1="58" x2="48" y2="58" stroke="#8ecd76" stroke-width="2.5" stroke-linecap="round"/>
</svg>
