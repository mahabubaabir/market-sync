name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          if ! sudo apt-get install -y python3-pyqt6 dpkg-dev; then
            pip3 install --user PyQt6
            echo "USING_PIP_PYQT=1" >> "$GITHUB_ENV"
          fi

      - name: Build .deb
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          chmod +x build-deb.sh install.sh
          ./build-deb.sh

      - name: Smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 -m py_compile main.py config.py markets.py calendar_api.py notifier.py ui.py updater.py
          python3 main.py --version
          timeout 20 python3 -c "
          import sys
          from PyQt6.QtWidgets import QApplication
          from config import load_settings
          from ui import TrayController
          app = QApplication(sys.argv); app.setQuitOnLastWindowClosed(False)
          c = TrayController(app, load_settings())
          c.tick(); c.quit_app()
          print('SMOKE_OK')
          "

      - name: Publish release with .deb
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
