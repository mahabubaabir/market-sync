name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyqt6 python3-pyqt6.qtsvg python3-requests libnotify-bin libxcb-cursor0

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 -m unittest discover -s tests -v

      - name: Compile Python modules
        run: |
          python3 -m py_compile main.py config.py markets.py calendar_api.py notifier.py ui.py updater.py

      - name: CLI smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 main.py --version
          python3 main.py --cli --once --news
